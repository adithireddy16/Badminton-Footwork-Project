<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Badminton Footwork Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Badminton Footwork Detection</h1>

        <p class="subtitle">
            Upload a badminton video to analyze player footwork
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="videoInput"
                accept="video/*"
            >

            <button id="analyzeButton">
                Analyze Video
            </button>

            <p id="status"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
